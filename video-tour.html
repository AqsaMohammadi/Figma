let start=0,duration=32000,recorder=null,chunks=[];
go.onclick=()=>{if(!window.MediaRecorder||!c.captureStream){statusEl.textContent='This browser cannot record the walkthrough.';return}go.disabled=true;download.style.display='none';statusEl.textContent='Recording walkthrough…';start=performance.now();const stream=c.captureStream(30);const mime=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(m=>MediaRecorder.isTypeSupported(m))||'';recorder=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{const blob=new Blob(chunks,{type:recorder.mimeType||'video/webm'}),url=URL.createObjectURL(blob);download.href=url;download.download='mini-figma-feature-walkthrough.webm';download.textContent=`Download video · ${(blob.size/1048576).toFixed(1)} MB`;download.style.display='inline';statusEl.textContent='Walkthrough ready.';go.disabled=false;go.textContent='Record again'};recorder.start(500);requestAnimationFrame(draw)};
function draw(now){if(!recorder||recorder.state!=='recording')return;const elapsed=now-start,secs=elapsed/1000;let k,local;if(secs<4){k=0;local=secs}else if(secs<10){k=1;local=secs-4}else if(secs<18){k=2;local=secs-10}else if(secs<25){k=3;local=secs-18}else{k=4;local=secs-25}scene(k,local);if(elapsed>=duration){recorder.stop();return}requestAnimationFrame(draw)}
